/*
 * Alternative without a function: one static argument per tag. Icinga skips
 * the argument when the macro cannot be resolved. Simpler, but adding a tag
 * means editing the NotificationCommand instead of the notification.
 *
 *   "--tag-location" = { key = "--tag", value = "Location=$host.vars.location$" }
 *   "--tag-team"     = { key = "--tag", value = "Team=$service.vars.team$" }
 */
