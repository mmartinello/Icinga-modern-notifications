/*
 * Icinga Modern Notifications - example Icinga 2 configuration.
 *
 * Copy to e.g. /etc/icinga2/conf.d/ (or your zones.d/global-templates) and
 * adapt paths, sender, Icinga Web URL and users to your environment.
 *
 * Custom variables used:
 *   imn_from           mail sender (notification/user level)
 *   imn_icingaweb_url  Icinga Web base URL (notification level)
 *   imn_environment    optional environment tag, e.g. "PROD" (host level)
 *   imn_tags           optional list of tags to show in the email, each one
 *                      { label = "...", variable = "<macro name without $>" }
 *                      (notification level, see ImnTagArguments below)
 *
 * Arguments whose macro cannot be resolved are skipped by Icinga; empty
 * values are handled by the application, so optional data never shows up
 * as a placeholder.
 */

const ImnCommand = "/usr/local/libexec/icinga-modern-notifications/icinga-modern-notifications"

/*
 * Builds one "--tag LABEL=VALUE" argument for each entry of imn_tags.
 * Entries whose variable does not exist or is empty are skipped, so the
 * same list works for every host and service. Variable names are written
 * without "$" so that Icinga does not try to resolve them in advance.
 *
 * NOTE: verify on your Icinga 2 version before production use (behaviour of
 * macro() for missing variables, empty result -> no argument).
 */
const ImnTagArguments = {{
  var result = []
  var specs = macro("$imn_tags$")
  if (typeof(specs) != Array) {
    return result
  }
  for (spec in specs) {
    if (typeof(spec) != Dictionary || !spec.label || !spec.variable) {
      continue
    }
    var value = macro("$" + spec.variable + "$")
    if (typeof(value) == Array) {
      value = value.join(", ")
    }
    if (value != null && string(value) != "") {
      result.add(spec.label + "=" + string(value))
    }
  }
  return result
}}

object NotificationCommand "imn-mail-host" {
  command = [ ImnCommand, "mail", "host" ]

  arguments += {
    "--notification-type" = { value = "$notification.type$", required = true }
    "--state" = { value = "$host.state$", required = true }
    "--host" = { value = "$host.name$", required = true }
    "--host-display-name" = "$host.display_name$"
    "--address" = "$address$"
    "--address6" = "$address6$"
    "--output" = { value = "$host.output$", required = true }
    "--long-output" = "$host.long_output$"
    "--notes" = "$host.notes$"
    "--author" = "$notification.author$"
    "--comment" = "$notification.comment$"
    "--environment" = "$host.vars.imn_environment$"
    "--icingaweb-url" = "$imn_icingaweb_url$"
    "--timestamp" = "$host.last_state_change$"
    "--duration" = "$host.duration_sec$"
    "--tag" = { value = ImnTagArguments, repeat_key = true }
    "--from" = { value = "$imn_from$", required = true }
    "--to" = { value = "$user.email$", required = true }
  }
}

object NotificationCommand "imn-mail-service" {
  command = [ ImnCommand, "mail", "service" ]

  arguments += {
    "--notification-type" = { value = "$notification.type$", required = true }
    "--state" = { value = "$service.state$", required = true }
    "--host" = { value = "$host.name$", required = true }
    "--host-display-name" = "$host.display_name$"
    "--address" = "$address$"
    "--address6" = "$address6$"
    "--service" = { value = "$service.name$", required = true }
    "--service-display-name" = "$service.display_name$"
    "--output" = { value = "$service.output$", required = true }
    "--long-output" = "$service.long_output$"
    "--notes" = "$service.notes$"
    "--author" = "$notification.author$"
    "--comment" = "$notification.comment$"
    "--environment" = "$host.vars.imn_environment$"
    "--icingaweb-url" = "$imn_icingaweb_url$"
    "--timestamp" = "$service.last_state_change$"
    "--duration" = "$service.duration_sec$"
    "--tag" = { value = ImnTagArguments, repeat_key = true }
    "--from" = { value = "$imn_from$", required = true }
    "--to" = { value = "$user.email$", required = true }
  }
}

/* Example apply rules: notify every user with an email address. */

apply Notification "imn-mail-host" to Host {
  command = "imn-mail-host"
  users = [ "icingaadmin" ]
  types = [ Problem, Recovery, Acknowledgement, Custom, DowntimeStart, DowntimeEnd ]
  states = [ Up, Down ]
  vars.imn_from = "Icinga <icinga@example.com>"
  vars.imn_icingaweb_url = "https://monitoring.example.com/icingaweb2"
  vars.imn_tags = [
    { label = "Location", variable = "host.vars.location" },
  ]
  assign where host.address
}

apply Notification "imn-mail-service" to Service {
  command = "imn-mail-service"
  users = [ "icingaadmin" ]
  types = [ Problem, Recovery, Acknowledgement, Custom, DowntimeStart, DowntimeEnd ]
  states = [ OK, Warning, Critical, Unknown ]
  vars.imn_from = "Icinga <icinga@example.com>"
  vars.imn_icingaweb_url = "https://monitoring.example.com/icingaweb2"
  vars.imn_tags = [
    { label = "Location", variable = "host.vars.location" },
    { label = "Team", variable = "service.vars.team" },
  ]
  assign where true
}

/*
 * Example host: the environment appears in subjects and headers, the
 * location as a tag. Hosts without vars.location simply get no tag.
 */
